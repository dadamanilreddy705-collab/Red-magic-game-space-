name: Convert HTML to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Use HTML to APK Action
      uses: darkshredder/web-to-app-action@main
      with:
        build-folder-path: "./"       # Root folder where your index.html is
        app-name: "MyAndroidApp"      # Change to your desired app name
        output-folder-path: "release-apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-debug-apk
        path: release-apk/
        
